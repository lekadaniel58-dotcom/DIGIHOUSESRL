name: Review official GP Porte classic collection
on:
  push:
    branches: [source/gp-classic]
    paths: ['scripts/inspect-gp-classic.py', 'scripts/fetch-gp-wood.py', 'docs/gp-classic-source/*requests.json']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/inspect-gp-classic.py
      - if: hashFiles('docs/gp-classic-source/asset-requests.json') != ''
        run: |
          pip install Pillow==11.3.0 PyMuPDF==1.26.6
          python scripts/fetch-gp-wood.py
      - name: Save sources for review
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/gp-classic-source
          if [ -d data/immagini ]; then git add "data/immagini/gp-wood-*" 2>/dev/null || true; fi
          if ! git diff --cached --quiet; then
            git commit -m "Save official GP Porte sources [skip ci]"
            git push
          fi
