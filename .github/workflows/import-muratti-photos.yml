name: Import Muratti original product photographs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/import-muratti-photos.py
      - .github/workflows/import-muratti-photos.yml
permissions:
  contents: write
concurrency:
  group: muratti-photo-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/import-muratti-photos.py
      - name: Save verified original photographs for review
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/muratti-*-thumb.webp public/assets/muratti-*-hd.webp docs/muratti-photo-sources.json
          if ! git diff --cached --quiet; then
            git commit -m 'Import higher definition Muratti product photographs'
            git push origin HEAD:main
          fi
