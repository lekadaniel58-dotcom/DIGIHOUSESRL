name: Deploy Digi House to GitHub Pages
# Rebuild and publish the compiled Vite site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            public/assets/fornitori/muratti-logo.png
            public/assets/fornitori/hex-logo.jpg
          key: original-partner-logos-v1
      - run: npm run fetch:partner-logos
      - run: npm run check:filters
      - run: npm run check:shutters
      - run: npm run check:fossati
      - run: npm run check:sections
      - run: npm run check:dierre
      - run: npm run check:pail
      - run: npm run check:gp-wood
      - run: npm run check:doors
      - run: npm run check:partners
      - run: npm run check:text
      - run: npm run check:search
      - run: npm run check:catalog
      - run: npm run check:bucket-formats
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published site (read only)
        run: python3 scripts/check-published-site.py
